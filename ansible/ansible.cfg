[defaults]
inventory = inventory/prod.ini
retry_files_enabled = False
host_key_checking = True
timeout = 15
force_handlers = True
# ansible-core 2.21: не засорять журнал предупреждениями об устаревании
# (INJECT_FACTS_AS_VARS и др.) и о найденном интерпретаторе Python на VM
deprecation_warnings = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
